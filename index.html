<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recicla - Consulta de Puntos</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>♻️ Recicla</h1>
    <p>Consulta tu puntaje ingresando tu ID de usuario</p>

    <!-- Contenedor principal para escritorio -->
    <div class="main-content">
      <!-- Sección izquierda: Consulta -->
      <div class="left-section">
        <input type="text" id="userId" placeholder="Ingresa tu ID">
        <button id="consultarBtn">Consultar</button>
        
        <!-- Selector de Top -->
        <div class="top-selector">
          <label for="topSelect">Ver ranking de:</label>
          <select id="topSelect">
            <option value="nada">Seleccionar</option>
            <option value="total">Top Total</option>
            <option value="latas">Top Latas</option>
            <option value="vidrio">Top Vidrio</option>
            <option value="tetra">Top TetraPak</option>
          </select>
        </div>

        <div id="status" role="status" aria-live="polite"></div>
        <p id="error" class="error oculto">No se encontró el usuario. Intenta con otro ID.</p>
      </div>

      <!-- Sección derecha: Resultados y Ranking -->
      <div class="right-section">
        <div id="resultado" class="resultado oculto">
          <h2 id="nombreUsuario"></h2>
          <div class="cards-container">
            <div class="card">
              <h4>Latas</h4>
              <div class="score" id="latas">0</div>
            </div>
            <div class="card">
              <h4>Tetra Pak</h4>
              <div class="score" id="tetra">0</div>
            </div>
            <div class="card">
              <h4>Vidrio</h4>
              <div class="score" id="vidrio">0</div>
            </div>
            <div class="card">
              <h4>Total</h4>
              <div class="score" id="total">0</div>
            </div>
          </div>
        </div>
        
        <!-- Ranking para escritorio - se mostrará aquí cuando esté visible -->
        <div id="rankingContainer" class="ranking oculto ranking-desktop">
          <h2>Ranking</h2>
          <div id="rankingLista"></div>
        </div>
      </div>
    </div>

    <!-- Ranking para móvil - siempre abajo -->
    <div id="rankingContainerMobile" class="ranking oculto ranking-mobile">
      <h2>Ranking</h2>
      <div id="rankingListaMobile"></div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
